<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZU English - Cloud Learning Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

    <!-- TOP BAR -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-2xl text-amber-300"></i>
                <h1 class="text-xl font-bold tracking-wide">AZU English</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span class="bg-indigo-800 px-3 py-1 rounded-full text-sm text-amber-300 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-trophy"></i> 45 XP
                </span>
                <span class="bg-indigo-800 px-3 py-1 rounded-full text-sm text-orange-300 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-fire"></i> 1 Ngày
                </span>
            </div>
        </div>
    </header>

    <!-- MAIN WRAPPER -->
    <div class="max-w-7xl mx-auto px-4 py-6">

        <!-- TAB NAVIGATION -->
        <div class="flex border-b border-slate-300 mb-6 bg-white rounded-t-xl px-4 pt-2 shadow-sm">
            <button id="tabFilesBtn" onclick="switchMainTab('files')" class="px-5 py-3 font-semibold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-folder-open"></i> Quản Lý Tệp Tin
            </button>
            <button id="tabBooksBtn" onclick="switchMainTab('books')" class="px-5 py-3 font-semibold text-slate-500 border-b-2 border-transparent hover:text-indigo-600 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-book-bookmark"></i> Sách Bổ Trợ (Độc Lập)
            </button>
        </div>

        <!-- ================= SECTION 1: QUẢN LÝ TỆP TIN (CŨ - GIỮ NGUYÊN) ================= -->
        <section id="sectionFiles" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-folder"></i> DANH SÁCH THƯ MỤC TỆP TIN
                    </h2>
                    <button onclick="createFolder('file')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-medium px-4 py-2 rounded-lg text-sm flex items-center gap-1 transition">
                        <i class="fa-solid fa-folder-plus"></i> + Tạo Thư Mục Mới
                    </button>
                </div>
                
                <!-- Folders List -->
                <div id="fileFolderList" class="flex flex-wrap gap-2 mb-4"></div>

                <!-- Tag Cloud Container (Đã sửa lỗi null) -->
                <div id="tagCloud" class="flex flex-wrap gap-1 mt-3"></div>
            </div>

            <!-- Current Folder Header & Upload -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 id="currentFileFolderName" class="text-2xl font-bold text-slate-800">Tất cả tệp</h3>
                        <p id="currentFileCount" class="text-sm text-slate-400">0 tệp tin</p>
                    </div>
                    <div>
                        <input type="file" id="fileInput" class="hidden" onchange="handleFileUpload(event, 'file')">
                        <button onclick="document.getElementById('fileInput').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm flex items-center gap-2 transition">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Tải file lên Cloud
                        </button>
                    </div>
                </div>

                <!-- File Grid Display -->
                <div id="fileGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
            </div>
        </section>

        <!-- ================= SECTION 2: SÁCH BỔ TRỢ (MỚI - ĐỘC LẬP) ================= -->
        <section id="sectionBooks" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-500">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-book"></i> THƯ MỤC SÁCH BỔ TRỢ
                    </h2>
                    <button onclick="createFolder('book')" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-medium px-4 py-2 rounded-lg text-sm flex items-center gap-1 transition">
                        <i class="fa-solid fa-folder-plus"></i> + Tạo Thư Mục Sách
                    </button>
                </div>
                
                <!-- Book Folders List -->
                <div id="bookFolderList" class="flex flex-wrap gap-2 mb-2"></div>
            </div>

            <!-- Current Book Folder Header & Upload -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 id="currentBookFolderName" class="text-2xl font-bold text-slate-800">Tất cả Sách</h3>
                        <p id="currentBookCount" class="text-sm text-slate-400">0 cuốn sách</p>
                    </div>
                    <div>
                        <input type="file" id="bookInput" accept=".pdf,.epub,.mobi" class="hidden" onchange="handleFileUpload(event, 'book')">
                        <button onclick="document.getElementById('bookInput').click()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm flex items-center gap-2 transition">
                            <i class="fa-solid fa-file-circle-plus"></i> Tải Sách Mới Lên
                        </button>
                    </div>
                </div>

                <!-- Book Grid Display -->
                <div id="bookGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
            </div>
        </section>

    </div>

    <!-- PREVIEW MODAL (DÙNG CHUNG AN TOÀN) -->
    <div id="previewModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h4 id="previewTitle" class="font-bold text-slate-800 text-lg truncate max-w-xl">Preview Document</h4>
                <div class="flex items-center gap-3">
                    <a id="previewDownloadBtn" href="#" target="_blank" download class="text-indigo-600 hover:bg-indigo-50 px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1 border border-indigo-200 transition">
                        <i class="fa-solid fa-download"></i> Tải về
                    </a>
                    <button onclick="closePreviewModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1 flex overflow-hidden">
                <div id="previewBody" class="flex-1 bg-slate-900 flex items-center justify-center p-2">
                    <!-- Dynamic iFrame / Viewer -->
                </div>
                <div class="w-80 border-l border-slate-200 p-4 bg-slate-50 flex flex-col">
                    <h5 class="font-bold text-slate-700 mb-2 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-note-sticky text-amber-500"></i> Ghi chú bài học
                    </h5>
                    <textarea id="fileNoteArea" class="flex-1 w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none" placeholder="Nhập ghi chú cá nhân ở đây..."></textarea>
                    <button onclick="saveNote()" class="mt-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-xl text-sm transition">
                        <i class="fa-solid fa-floppy-disk"></i> Lưu ghi chú
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ - ĐẢM BẢO CHẠY MƯỢT VÀ AN TOÀN -->
    <script>
        // 1. KHỞI TẠO DỮ LIỆU ĐỘC LẬP
        let fileFolders = JSON.parse(localStorage.getItem('azu_file_folders')) || ['Tài liệu chung', 'Destination', 'Ngữ pháp'];
        let fileList = JSON.parse(localStorage.getItem('azu_file_list')) || [];
        let currentFileFolder = 'Tất cả';

        let bookFolders = JSON.parse(localStorage.getItem('azu_book_folders')) || ['Sách Giáo Khoa', 'Sách Tham Khảo'];
        let bookList = JSON.parse(localStorage.getItem('azu_book_list')) || [];
        let currentBookFolder = 'Tất cả';

        let currentPreviewItem = null;

        // Khởi chạy ban đầu
        window.onload = function() {
            renderFileFolders();
            renderFiles();
            renderBookFolders();
            renderBooks();
        };

        // 2. CHUYỂN TAB MÀN HÌNH
        function switchMainTab(tab) {
            const secFiles = document.getElementById('sectionFiles');
            const secBooks = document.getElementById('sectionBooks');
            const btnFiles = document.getElementById('tabFilesBtn');
            const btnBooks = document.getElementById('tabBooksBtn');

            if (tab === 'files') {
                secFiles.classList.remove('hidden');
                secBooks.classList.add('hidden');
                btnFiles.className = "px-5 py-3 font-semibold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2 transition-all";
                btnBooks.className = "px-5 py-3 font-semibold text-slate-500 border-b-2 border-transparent hover:text-indigo-600 flex items-center gap-2 transition-all";
            } else {
                secFiles.classList.add('hidden');
                secBooks.classList.remove('hidden');
                btnBooks.className = "px-5 py-3 font-semibold text-emerald-600 border-b-2 border-emerald-600 flex items-center gap-2 transition-all";
                btnFiles.className = "px-5 py-3 font-semibold text-slate-500 border-b-2 border-transparent hover:text-emerald-600 flex items-center gap-2 transition-all";
            }
        }

        // 3. TẠO THƯ MỤC
        function createFolder(type) {
            const name = prompt(type === 'file' ? "Nhập tên thư mục tệp tin:" : "Nhập tên thư mục sách bổ trợ:");
            if (!name || !name.trim()) return;
            const folderName = name.trim();

            if (type === 'file') {
                if (!fileFolders.includes(folderName)) {
                    fileFolders.push(folderName);
                    localStorage.setItem('azu_file_folders', JSON.stringify(fileFolders));
                    renderFileFolders();
                }
            } else {
                if (!bookFolders.includes(folderName)) {
                    bookFolders.push(folderName);
                    localStorage.setItem('azu_book_folders', JSON.stringify(bookFolders));
                    renderBookFolders();
                }
            }
        }

        // 4. RENDER THƯ MỤC & TỆP TIN (FILE MANAGEMENT)
        function renderFileFolders() {
            const container = document.getElementById('fileFolderList');
            if (!container) return; // Bảo vệ an toàn tuyệt đối
            
            let html = `<button onclick="selectFileFolder('Tất cả')" class="px-3 py-1.5 rounded-lg text-sm font-medium ${currentFileFolder === 'Tất cả' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">💼 Tất cả</button>`;
            
            fileFolders.forEach(f => {
                html += `<button onclick="selectFileFolder('${f}')" class="px-3 py-1.5 rounded-lg text-sm font-medium ${currentFileFolder === f ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">📁 ${f}</button>`;
            });
            container.innerHTML = html;
        }

        function selectFileFolder(folder) {
            currentFileFolder = folder;
            document.getElementById('currentFileFolderName').innerText = folder;
            renderFileFolders();
            renderFiles();
        }

        function renderFiles() {
            const grid = document.getElementById('fileGrid');
            if (!grid) return;

            const filtered = currentFileFolder === 'Tất cả' ? fileList : fileList.filter(item => item.folder === currentFileFolder);
            document.getElementById('currentFileCount').innerText = `${filtered.length} tệp tin`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 italic">Chưa có tệp tin nào trong thư mục này</div>`;
                renderTagCloud();
                return;
            }

            grid.innerHTML = filtered.map(file => `
                <div class="border border-slate-200 rounded-xl p-4 bg-white hover:shadow-md transition relative group flex flex-col justify-between">
                    <div class="cursor-pointer" onclick="openPreview('${file.id}', 'file')">
                        <div class="flex items-center gap-3 mb-3">
                            <i class="fa-solid fa-file-pdf text-red-500 text-3xl"></i>
                            <div class="overflow-hidden">
                                <h5 class="font-bold text-slate-800 text-sm truncate" title="${file.name}">${file.name}</h5>
                                <span class="text-xs text-slate-400">${file.size || 'PDF'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-100 text-xs text-slate-400">
                        <span>${file.folder}</span>
                        <button onclick="deleteItem('${file.id}', 'file')" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            renderTagCloud();
        }

        // 5. RENDER THƯ MỤC & SÁCH (BOOK MANAGEMENT)
        function renderBookFolders() {
            const container = document.getElementById('bookFolderList');
            if (!container) return;

            let html = `<button onclick="selectBookFolder('Tất cả')" class="px-3 py-1.5 rounded-lg text-sm font-medium ${currentBookFolder === 'Tất cả' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">📚 Tất cả sách</button>`;
            
            bookFolders.forEach(f => {
                html += `<button onclick="selectBookFolder('${f}')" class="px-3 py-1.5 rounded-lg text-sm font-medium ${currentBookFolder === f ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">📖 ${f}</button>`;
            });
            container.innerHTML = html;
        }

        function selectBookFolder(folder) {
            currentBookFolder = folder;
            document.getElementById('currentBookFolderName').innerText = folder;
            renderBookFolders();
            renderBooks();
        }

        function renderBooks() {
            const grid = document.getElementById('bookGrid');
            if (!grid) return;

            const filtered = currentBookFolder === 'Tất cả' ? bookList : bookList.filter(item => item.folder === currentBookFolder);
            document.getElementById('currentBookCount').innerText = `${filtered.length} cuốn sách`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 italic">Chưa có cuốn sách bổ trợ nào ở đây</div>`;
                return;
            }

            grid.innerHTML = filtered.map(book => `
                <div class="border border-slate-200 rounded-xl p-4 bg-emerald-50/30 border-l-4 border-l-emerald-500 hover:shadow-md transition relative flex flex-col justify-between">
                    <div class="cursor-pointer" onclick="openPreview('${book.id}', 'book')">
                        <div class="flex items-center gap-3 mb-3">
                            <i class="fa-solid fa-book-open text-emerald-600 text-3xl"></i>
                            <div class="overflow-hidden">
                                <h5 class="font-bold text-slate-800 text-sm truncate" title="${book.name}">${book.name}</h5>
                                <span class="text-xs text-slate-400">${book.size || 'Sách PDF'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-200 text-xs text-slate-400">
                        <span class="text-emerald-700 font-medium">${book.folder}</span>
                        <button onclick="deleteItem('${book.id}', 'book')" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // 6. XỬ LÝ UPLOAD AN TOÀN TỰ ĐỘNG
        function handleFileUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const fileUrl = URL.createObjectURL(file); // Tạo blob URL an toàn hiển thị ngay lập tức
            const newItem = {
                id: 'id_' + Date.now(),
                name: file.name,
                url: fileUrl,
                size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                folder: type === 'file' ? (currentFileFolder === 'Tất cả' ? 'Tài liệu chung' : currentFileFolder) 
                                       : (currentBookFolder === 'Tất cả' ? 'Sách Tham Khảo' : currentBookFolder),
                note: ''
            };

            if (type === 'file') {
                fileList.push(newItem);
                localStorage.setItem('azu_file_list', JSON.stringify(fileList));
                renderFiles();
            } else {
                bookList.push(newItem);
                localStorage.setItem('azu_book_list', JSON.stringify(bookList));
                renderBooks();
            }
            event.target.value = ''; // Reset input
        }

        // 7. PREVIEW VÀ XÓA AN TOÀN
        function openPreview(id, type) {
            const list = type === 'file' ? fileList : bookList;
            const item = list.find(x => x.id === id);
            if (!item) return;

            currentPreviewItem = { ...item, type };
            document.getElementById('previewTitle').innerText = item.name;
            document.getElementById('previewDownloadBtn').href = item.url;
            document.getElementById('fileNoteArea').value = item.note || '';

            const body = document.getElementById('previewBody');
            body.innerHTML = `<iframe src="${item.url}" class="w-full h-full rounded-lg border-0"></iframe>`;

            document.getElementById('previewModal').classList.remove('hidden');
        }

        function closePreviewModal() {
            document.getElementById('previewModal').classList.add('hidden');
            document.getElementById('previewBody').innerHTML = '';
        }

        function saveNote() {
            if (!currentPreviewItem) return;
            const noteVal = document.getElementById('fileNoteArea').value;
            const list = currentPreviewItem.type === 'file' ? fileList : bookList;
            const item = list.find(x => x.id === currentPreviewItem.id);
            if (item) {
                item.note = noteVal;
                localStorage.setItem(currentPreviewItem.type === 'file' ? 'azu_file_list' : 'azu_book_list', JSON.stringify(list));
                alert("Đã lưu ghi chú thành công!");
            }
        }

        function deleteItem(id, type) {
            if (!confirm("Bạn có chắc chắn muốn xóa không?")) return;
            if (type === 'file') {
                fileList = fileList.filter(x => x.id !== id);
                localStorage.setItem('azu_file_list', JSON.stringify(fileList));
                renderFiles();
            } else {
                bookList = bookList.filter(x => x.id !== id);
                localStorage.setItem('azu_book_list', JSON.stringify(bookList));
                renderBooks();
            }
        }

        // 8. BẢO VỆ HÀM RENDER TAG CLOUD (Tránh lỗi null tuyệt đối)
        function renderTagCloud() {
            const container = document.getElementById('tagCloud');
            if (!container) return; // <--- Sửa triệt để lỗi cũ ở đây
            container.innerHTML = '<span class="text-xs text-slate-400 italic">Hệ thống phân loại tag tự động sẵn sàng</span>';
        }
    </script>
</body>
</html>
