<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra Từ Điển Thông Minh - AZU English</title>
<!-- THÊM 2 DÒNG NÀY ĐỂ NÚT LƯU FLASHCARD ĐẸP HƠN -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- KẾT THÚC THÊM -->

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa; color: #1a1a1a; min-height: 100vh; padding: 24px 16px;
  }
  .container { max-width: 860px; margin: 0 auto; }
  .back-link { display: inline-block; margin-bottom: 24px; color: #4a6cf7; text-decoration: none; font-size: 14px; }
  .back-link:hover { text-decoration: underline; }
  h1 { font-size: 26px; margin-bottom: 8px; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
  .search-box { display: flex; gap: 8px; margin-bottom: 24px; }
  .search-box input {
    flex: 1; padding: 14px 18px; font-size: 16px;
    border: 2px solid #e0e4eb; border-radius: 12px; outline: none; transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: #4a6cf7; }
  .search-box button {
    padding: 14px 28px; background: #4a6cf7; color: white; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .search-box button:hover { background: #3a5ce5; }
  .search-box button:disabled { background: #a0a8c0; cursor: not-allowed; }

  .status { text-align: center; padding: 24px; color: #666; font-size: 15px; }
  .status.error { color: #d93025; background: #fff5f5; border-radius: 12px; border: 1px solid #ffcccc; }

  .card {
    background: white; border-radius: 16px; padding: 28px; margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #eef0f4;
  }
  .word-header {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 16px;
    margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #f0f2f5;
  }
  .word-title { font-size: 36px; font-weight: 800; color: #1a1a1a; }
  .word-phonetic { color: #666; font-size: 18px; }
  .audio-btn {
    background: #eef2ff; border: none; border-radius: 50%; width: 44px; height: 44px;
    cursor: pointer; font-size: 18px; display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.2s; color: #4a6cf7;
  }
  .audio-btn:hover { background: #dbe4ff; }

  .section { margin-bottom: 28px; }
  .section-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    color: #4a6cf7; background: #eef2ff; display: inline-block;
    padding: 4px 12px; border-radius: 6px; margin-bottom: 14px;
  }
  .english-def {
    padding: 10px 0 10px 18px; border-left: 3px solid #e0e4eb;
    margin-bottom: 12px; line-height: 1.7; font-size: 16px; color: #333;
  }
  .english-def strong { color: #1a1a1a; }
  .example { color: #666; font-style: italic; font-size: 15px; margin-top: 6px; display: block; }

  .chip-container { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-block; padding: 6px 14px; border-radius: 20px;
    font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
    background: #f1f3f5; color: #333; border: 1px solid #e0e4eb;
  }
  .chip:hover { background: #e2e6ea; border-color: #cdd3db; }
  .chip.synonym { background: #e8f0fe; color: #1a56db; border-color: #c7d7fc; }
  .chip.synonym:hover { background: #d2e3fc; }
  .chip.antonym { background: #fce8e6; color: #c5221f; border-color: #fad2cf; }
  .chip.antonym:hover { background: #f8d1cd; }

  .ai-section { background: #fafbff; border-radius: 12px; padding: 20px; border: 1px solid #eef0f4; }
  .ai-content { line-height: 1.8; font-size: 15px; color: #333; }
  .ai-content p { margin-bottom: 10px; }
  .ai-content strong { color: #1a1a1a; }
  .ai-content ul { padding-left: 20px; margin-bottom: 10px; }
  
  .loading-spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 3px solid #e0e4eb; border-top-color: #4a6cf7; border-radius: 50%;
    animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <a href="./" class="back-link">← Về trang chủ</a>
  <h1>📖 Tra Từ Điển Thông Minh</h1>
  <p class="subtitle">Nhập một từ tiếng Anh để xem định nghĩa, bản dịch, từ đồng nghĩa/trái nghĩa và cụm từ đi kèm.</p>

  <div class="search-box">
    <input type="text" id="wordInput" placeholder="Nhập từ cần tra... (vd: beautiful, resilient, look)" autocomplete="off" />
    <button id="searchBtn">Tra cứu</button>
  </div>

  <div id="results"></div>
</div>

<script>
const SUPABASE_URL = "https://zgkdrxwyylecszxywiqm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ma1C-Vbj3wI4He3ut084OA_RwA4VryR";

const input = document.getElementById('wordInput');
const btn = document.getElementById('searchBtn');
const results = document.getElementById('results');

async function lookupWord(word) {
  word = word.trim().toLowerCase();
  if (!word) return;

  btn.disabled = true;
  results.innerHTML = '<div class="status"><span class="loading-spinner"></span> Đang tra cứu từ điển...</div>';

  try {
    const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    
    if (!dictRes.ok) {
      if (dictRes.status === 404) {
        results.innerHTML = `<div class="status error">Không tìm thấy từ "${word}". Bạn kiểm tra lại chính tả nhé!</div>`;
      } else {
        results.innerHTML = `<div class="status error">Lỗi khi tra từ điển (Mã: ${dictRes.status}). Vui lòng thử lại.</div>`;
      }
      btn.disabled = false;
      return;
    }

    const dictData = await dictRes.json();
    const entry = dictData[0];

    renderDictionaryCard(entry);

    results.innerHTML += '<div class="status" id="aiLoading" style="margin-top:20px;"><span class="loading-spinner"></span> AI đang phân tích và dịch nghĩa...</div>';
    
    await callAI(word, entry);
    
    const aiLoading = document.getElementById('aiLoading');
    if (aiLoading) aiLoading.remove();

  } catch (err) {
    console.error(err);
    results.innerHTML = '<div class="status error">Có lỗi xảy ra trong quá trình tra cứu. Vui lòng kiểm tra kết nối mạng.</div>';
  } finally {
    btn.disabled = false;
  }
}

function renderDictionaryCard(entry) {
  const card = document.createElement('div');
  card.className = 'card';

  let audioUrl = '';
  let phoneticText = entry.phonetic || '';
  if (entry.phonetics) {
    for (const p of entry.phonetics) {
      if (p.audio && !audioUrl) audioUrl = p.audio;
      if (p.text && !phoneticText) phoneticText = p.text;
    }
  }

  let headerHtml = `<div class="word-header">`;
  headerHtml += `<span class="word-title">${escapeHtml(entry.word)}</span>`;
  if (phoneticText) headerHtml += `<span class="word-phonetic">${escapeHtml(phoneticText)}</span>`;
  headerHtml += `<button type="button" class="audio-btn" data-word="${escapeHtml(entry.word)}" data-fallback-audio="${escapeHtml(audioUrl)}" title="Nghe phát âm AI">🔊</button>`;
  headerHtml += `</div>`;
  card.innerHTML = headerHtml;

  if (entry.meanings) {
    entry.meanings.forEach(m => {
      const section = document.createElement('div');
      section.className = 'section';
      let html = `<span class="section-title">${escapeHtml(m.partOfSpeech || 'Định nghĩa')}</span>`;
      if (m.definitions) {
        m.definitions.slice(0, 4).forEach(d => {
          html += `<div class="english-def">`;
          html += `<strong>${escapeHtml(d.definition)}</strong>`;
          if (d.example) html += `<span class="example">"${escapeHtml(d.example)}"</span>`;
          html += `</div>`;
        });
      }
      section.innerHTML = html;
      card.appendChild(section);
    });
  }

  const synonyms = new Set();
  const antonyms = new Set();
  if (entry.meanings) {
    entry.meanings.forEach(m => {
      if (m.synonyms) m.synonyms.forEach(s => synonyms.add(s));
      if (m.antonyms) m.antonyms.forEach(a => antonyms.add(a));
      if (m.definitions) {
        m.definitions.forEach(d => {
          if (d.synonyms) d.synonyms.forEach(s => synonyms.add(s));
          if (d.antonyms) d.antonyms.forEach(a => antonyms.add(a));
        });
      }
    });
  }

  if (synonyms.size > 0) {
    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `<span class="section-title">Từ đồng nghĩa (English)</span>
      <div class="chip-container">${[...synonyms].slice(0, 10).map(s => `<span class="chip synonym" data-word="${escapeHtml(s)}">${escapeHtml(s)}</span>`).join('')}</div>`;
    card.appendChild(section);
  }

  if (antonyms.size > 0) {
    const section = document.createElement('div');
    section.className = 'section';
    section.innerHTML = `<span class="section-title">Từ trái nghĩa (English)</span>
      <div class="chip-container">${[...antonyms].slice(0, 10).map(a => `<span class="chip antonym" data-word="${escapeHtml(a)}">${escapeHtml(a)}</span>`).join('')}</div>`;
    card.appendChild(section);
  }

  card.querySelectorAll('.audio-btn').forEach(b => {
    b.addEventListener('click', async () => {
      const wordToSpeak = b.getAttribute('data-word');
      const fallbackUrl = b.getAttribute('data-fallback-audio');
      await playGroqTTS(wordToSpeak, fallbackUrl, b);
    });
  });
  card.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const w = chip.getAttribute('data-word');
      input.value = w;
      lookupWord(w);
    });
  });

  results.innerHTML = '';
  results.appendChild(card);
}

async function callAI(word, dictEntry) {
  let context = `Từ: "${word}".\n`;
  if (dictEntry.meanings) {
    dictEntry.meanings.forEach(m => {
      if (m.definitions) {
        m.definitions.slice(0, 3).forEach(d => {
          context += `- (${m.partOfSpeech}) ${d.definition}\n`;
        });
      }
    });
  }

  const prompt = `Bạn là từ điển Anh-Việt. Hãy phân tích từ "${word}". Các định nghĩa gốc: ${context}.
YÊU CẦU BẮT BUỘC: 
1. Chỉ trả về mã HTML thô (không dùng markdown, không giải thích).
2. Sử dụng chính xác cấu trúc HTML sau:
<div class="section">
  <span class="section-title">Nghĩa tiếng Việt</span>
  <div class="ai-content"><p><strong>Nghĩa chính:</strong> (liệt kê nghĩa Việt)</p></div>
</div>
<div class="section">
  <span class="section-title">Từ đồng / trái nghĩa</span>
  <div class="ai-content">
    <p><strong>Đồng nghĩa:</strong> (liệt kê từ tiếng Anh + nghĩa Việt)</p>
    <p><strong>Trái nghĩa:</strong> (liệt kê từ tiếng Anh + nghĩa Việt)</p>
  </div>
</div>
<div class="section">
  <span class="section-title">Cụm từ & Giới từ</span>
  <div class="ai-content"><ul><li>(3-5 cụm từ/collocations + giới từ, giải thích ngắn)</li></ul></div>
</div>
<div class="section">
  <span class="section-title">Ví dụ</span>
  <div class="ai-content"><p>(1-2 câu ví dụ + dịch nghĩa)</p></div>
</div>`;

  try {
    const aiCard = document.createElement('div');
    aiCard.className = 'card ai-section';
    const contentDiv = document.createElement('div');
    aiCard.appendChild(contentDiv);
    results.appendChild(aiCard);

    contentDiv.innerHTML = '<div class="status"><span class="loading-spinner"></span> AI đang xử lý...</div>';

    const response = await fetch(`${SUPABASE_URL}/functions/v1/ai-dictionary`, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ prompt: prompt })
    });

    const contentType = response.headers.get("content-type");
    if (contentType && contentType.includes("application/json")) {
      const data = await response.json();
      contentDiv.innerHTML = `<div class="status error">${data.error || 'Lỗi không xác định'}</div>`;
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let fullHtml = '';
    let buffer = '';
    let isFirstChunk = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split(/\r?\n/);
      buffer = lines.pop(); 

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const dataStr = line.replace('data: ', '').trim();
          if (dataStr === '[DONE]') continue;
          
          try {
            const dataObj = JSON.parse(dataStr);
            // Groq trả về choices[0].delta.content
            if (dataObj.choices && dataObj.choices[0].delta && dataObj.choices[0].delta.content) {
              if (isFirstChunk) {
                contentDiv.innerHTML = '';
                isFirstChunk = false;
              }
              fullHtml += dataObj.choices[0].delta.content;
              contentDiv.innerHTML = fullHtml.replace(/```html/g, '').replace(/```/g, '').trim();
            }
          } catch (e) {}
        }
      }
    }

    const cleanHtml = fullHtml.replace(/```html/g, '').replace(/```/g, '').trim();
    
    if (cleanHtml) {
       const saveBtn = document.createElement('button');
       saveBtn.className = 'mt-4 bg-pink-500 hover:bg-pink-600 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2 shadow-sm w-full justify-center';
       saveBtn.innerHTML = '<i class="fa-solid fa-plus-circle text-lg"></i> Lưu từ này vào Flashcards cá nhân';
       saveBtn.onclick = () => saveToFlashcard(word, cleanHtml);
       aiCard.appendChild(saveBtn);
    } else {
       contentDiv.innerHTML = '<div class="status error">AI không trả về nội dung. Vui lòng thử lại.</div>';
    }

  } catch (err) {
    results.innerHTML += `<div class="status error">Lỗi kết nối AI: ${err.message}</div>`;
  }
}

function saveToFlashcard(word, aiHtml) {
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = aiHtml;
  let autoMeaning = "Chưa có nghĩa";
  
  const paragraphs = tempDiv.querySelectorAll('p');
  for (let p of paragraphs) {
    if (p.innerText.includes('Nghĩa chính:') || p.innerText.includes('Nghĩa tiếng Việt:')) {
      autoMeaning = p.innerText.replace('Nghĩa chính:', '').replace('Nghĩa tiếng Việt:', '').trim();
      break;
    }
  }

  const userMeaning = prompt(`Xác nhận nghĩa tiếng Việt cho từ "${word}" (Bạn có thể sửa lại):`, autoMeaning);
  
  if (userMeaning === null) return;
  if (userMeaning.trim() === '') {
    alert('Nghĩa không được để trống!');
    return;
  }

  let customCards = JSON.parse(localStorage.getItem('azu_public_custom_cards')) || [];

  if (customCards.some(c => c.word.toLowerCase() === word.toLowerCase())) {
    alert('Từ này đã có trong Flashcards của bạn rồi!');
    return;
  }

  customCards.push({
    id: 'c_' + Date.now(),
    word: word,
    meaning: userMeaning.trim()
  });

  localStorage.setItem('azu_public_custom_cards', JSON.stringify(customCards));
  alert(`🎉 Đã lưu "${word}" vào Flashcards cá nhân! Hãy quay lại Trang chủ và mở tính năng Flashcards để ôn tập nhé.`);
}

 const dictTtsCache = {};
let activeDictAudio = null;

async function playGroqTTS(text, fallbackUrl, btnEl) {
  if (!text) return;
  if (activeDictAudio) {
    activeDictAudio.pause();
    activeDictAudio = null;
  }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();

  const key = text.trim().toLowerCase();
  if (dictTtsCache[key]) {
    activeDictAudio = new Audio(dictTtsCache[key]);
    activeDictAudio.play().catch(() => {});
    return;
  }

  const originalIcon = btnEl ? btnEl.innerHTML : '🔊';
  if (btnEl) btnEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm"></i>';

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/ai-dictionary`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({
        action: 'tts',
        text: text.trim(),
        lang: 'en'
      })
    });

    if (!res.ok) throw new Error('Groq TTS error');

    const blob = await res.blob();
    const audioUrl = URL.createObjectURL(blob);
    dictTtsCache[key] = audioUrl;

    activeDictAudio = new Audio(audioUrl);
    await activeDictAudio.play();
  } catch (err) {
    // Dự phòng bằng audio từ điển gốc hoặc giọng trình duyệt
    if (fallbackUrl) {
      activeDictAudio = new Audio(fallbackUrl);
      activeDictAudio.play().catch(() => {});
    } else if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    }
  } finally {
    if (btnEl) btnEl.innerHTML = originalIcon;
  }
}
 
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

btn.addEventListener('click', () => lookupWord(input.value));
input.addEventListener('keydown', e => { if (e.key === 'Enter') lookupWord(input.value); });
</script>
</body>
</html>
